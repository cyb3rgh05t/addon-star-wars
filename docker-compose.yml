services:
  addon-star-wars:
    image: ghcr.io/cyb3rgh05t/addon-star-wars
    container_name: addon-star-wars
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 7777
      PUBLIC_URL: ${PUBLIC_URL}
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.addon-star-wars.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.addon-star-wars.entrypoints=websecure
      - traefik.http.routers.addon-star-wars.tls=true
      - traefik.http.routers.addon-star-wars.tls.certresolver=dns-cloudflare
      - traefik.http.services.addon-star-wars.loadbalancer.server.port=7777

networks:
  proxy:
    name: proxy
    external: true
